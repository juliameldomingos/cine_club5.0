{% extends 'base.html' %}

{% block content %}
<h1 class="titulo-pagina">Cadastro de Perfis</h1>

<div class="painel">
  <form action="{{ url_for('inserir_perfil') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row mb-4">
      <div class="col-md-6">
        <label for="nome" class="form-label">Nome do Perfil:</label>
        <input type="text" class="form-control" id="nome" name="nome" value="{{ nome }}" required minlength="3" maxlength="100">
      </div>
      <div class="col-md-6">
        <label for="descricao" class="form-label">Descrição:</label>
        <input type="text" class="form-control" id="descricao" name="descricao" value="{{ descricao or '' }}" maxlength="255">
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <a href="{{ url_for('listar_perfis') }}" class="text-decoration-none ms-3">Voltar</a>
      <div>
        <button type="reset" class="btn btn-secondary me-2">Limpar</button>
        <button type="submit" class="btn btn-success">Salvar</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
