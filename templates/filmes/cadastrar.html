{% extends 'base.html' %}

{% block content %}
<h1 class="titulo-pagina">Cadastro de Filmes</h1>

<div class="painel">
  <form>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="titulo" class="form-label">Título do Filme:</label>
        <input type="text" class="form-control" id="titulo" name="titulo">
      </div>
      <div class="col-md-6">
        <label for="diretor" class="form-label">Diretor:</label>
        <input type="text" class="form-control" id="diretor" name="diretor">
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-4">
        <label for="genero" class="form-label">Gênero:</label>
        <select class="form-select" id="genero" name="genero">
          <option value="">-- ESCOLHA --</option>
          <option>Ação</option>
          <option>Animação</option>
          <option>Aventura</option>
          <option>Comédia</option>
          <option>Crime</option>
          <option>Drama</option>
          <option>Fantasia</option>
          <option>Ficção científica</option>
          <option>Infantil</option>
          <option>Terror</option>
          <option>Romance</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="ano" class="form-label">Ano de Lançamento:</label>
        <input type="number" class="form-control" id="ano" name="ano">
      </div>
      <div class="col-md-4">
        <label for="duracao" class="form-label">Duração (minutos):</label>
        <input type="number" class="form-control" id="duracao" name="duracao">
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <a href="{{ url_for('listar_filmes') }}" class="text-decoration-none ms-3">Voltar</a>
      <div>
        <button type="reset" class="btn btn-secondary me-2">Limpar</button>
        <button type="submit" class="btn btn-success">Salvar</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
