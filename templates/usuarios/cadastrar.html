{% extends 'base.html' %}

{% block content %}
<h1 class="titulo-pagina">Cadastro de Usuários</h1>

<div class="painel">
  <form>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" class="form-control" id="nome" name="nome">
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" name="email">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-3">
        <label for="celular" class="form-label">Celular:</label>
        <input type="text" class="form-control" id="celular" name="celular">
      </div>
      <div class="col-md-3">
        <label for="nascimento" class="form-label">Data de Nascimento:</label>
        <input type="date" class="form-control" id="nascimento" name="nascimento">
      </div>
      <div class="col-md-3">
        <label for="cpf" class="form-label">CPF:</label>
        <input type="text" class="form-control" id="cpf" name="cpf">
      </div>
      <div class="col-md-3">
        <label for="nivel" class="form-label text-danger fw-bold">Nível de Acesso:</label>
        <select class="form-select" id="nivel" name="nivel">
          <option value="">-- ESCOLHA --</option>
          <option>Usuário</option>
          <option>Administrador</option>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-3">
        <label for="cep" class="form-label">CEP:</label>
        <input type="text" class="form-control" id="cep" name="cep">
      </div>
      <div class="col-md-7">
        <label for="endereco" class="form-label">Endereço:</label>
        <input type="text" class="form-control" id="endereco" name="endereco">
      </div>
      <div class="col-md-2">
        <label for="numero" class="form-label">Número:</label>
        <input type="text" class="form-control" id="numero" name="numero">
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-4">
        <label for="complemento" class="form-label">Complemento:</label>
        <input type="text" class="form-control" id="complemento" name="complemento">
      </div>
      <div class="col-md-4">
        <label for="cidade" class="form-label">Cidade:</label>
        <input type="text" class="form-control" id="cidade" name="cidade">
      </div>
      <div class="col-md-4">
        <label for="estado" class="form-label">Estado:</label>
        <select class="form-select" id="estado" name="estado">
          <option value="">-- ESCOLHA --</option>
          <option>AC</option>
          <option>AL</option>
          <option>AP</option>
          <option>AM</option>
          <option>BA</option>
          <option>CE</option>
          <option>DF</option>
          <option>ES</option>
          <option>GO</option>
          <option>MA</option>
          <option>MT</option>
          <option>MS</option>
          <option>MG</option>
          <option>PA</option>
          <option>PB</option>
          <option>PR</option>
          <option>PE</option>
          <option>PI</option>
          <option>RJ</option>
          <option>RN</option>
          <option>RS</option>
          <option>RO</option>
          <option>RR</option>
          <option>SC</option>
          <option>SP</option>
          <option>SE</option>
          <option>TO</option>
        </select>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <a href="{{ url_for('listar_usuarios') }}" class="text-decoration-none ms-3">Voltar</a>
      <div>
        <button type="reset" class="btn btn-secondary me-2">Limpar</button>
        <button type="submit" class="btn btn-success">Salvar</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
